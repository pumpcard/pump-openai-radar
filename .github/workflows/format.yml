name: Format

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ruff-format:
    name: ruff format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check formatting
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: format --check --diff
