[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openai-radar"
version = "2.1.0"
description = "OpenAI infrastructure FinOps SDK — scan, analyze, and export your OpenAI org resources"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mor Michaeli" }]
keywords = ["openai", "finops", "cloud-cost", "llm", "radar", "hyperscaler"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    "openai>=1.60.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
    "anyio>=4.0.0",
    "lxml>=5.0.0", # draw.io XML generation
]

[project.optional-dependencies]
# Export formats — CSV and draw.io ship in the base install; these are kept as
# no-op aliases so existing `openai-radar[csv]` / `[drawio]` pins keep resolving.
csv = []
drawio = []

# Agent integrations
agents = ["openai-agents>=0.22.0"]        # run Radar as openai-agents tools

# Full install
all = ["openai-radar[agents]"]

[dependency-groups]
dev = ["ruff>=0.16.10"]

[project.urls]
Homepage = "https://github.com/gomorsmi/openai-radar"
Repository = "https://github.com/gomorsmi/openai-radar"
"Bug Tracker" = "https://github.com/gomorsmi/openai-radar/issues"
PyPI = "https://pypi.org/project/openai-radar/"

[project.scripts]
openai-radar = "openai_radar.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/openai_radar"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.mypy]
python_version = "3.10"
strict = true
